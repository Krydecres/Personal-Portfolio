# In-memory demo profile (see TestPortfolioApplication). Never used by the production jar.
spring:
  datasource:
    url: jdbc:h2:mem:portfolio-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
