# Optional: a MySQL 8.4 for the portfolio if you do not want to use a locally installed one.
# Exposed on 3307 so it does not clash with a local MySQL on 3306. Then set DB_PORT=3307.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3307:3306"   # bound to localhost only
    volumes:
      - portfolio-mysql:/var/lib/mysql
volumes:
  portfolio-mysql:
